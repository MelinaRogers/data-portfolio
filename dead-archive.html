<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grateful Dead Live Music Archive — preservation profile</title>
<style>
:root{
  color-scheme: light;
  --surface:#fcfcfb; --plane:#f4f4f1; --panel:#ffffff; --rail:#f7f7f5;
  --ink:#0b0b0b; --ink-2:#52514e;
  
  --muted:#6f6e69;
  --grid:#e1e0d9; --axis:#c3c2b7; --line:#dcdbd4; --line-2:#ebeae4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#0ca30c; --warn:#8a6200; --crit:#d03b3b;
  --sel:#8C1515; --sel-wash:rgba(140,21,21,.08);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme=light])){
    color-scheme: dark;
    --surface:#141413; --plane:#0b0b0a; --panel:#1a1a19; --rail:#161615;
    --ink:#fff; --ink-2:#c3c2b7; --muted:#8f8d86;
    --grid:#2c2c2a; --axis:#3a3a37; --line:#2e2e2b; --line-2:#232321;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --warn:#fab219;
    --sel:#e8574f; --sel-wash:rgba(232,87,79,.13);
  }
}
:root[data-theme=dark]{
  color-scheme: dark;
  --surface:#141413; --plane:#0b0b0a; --panel:#1a1a19; --rail:#161615;
  --ink:#fff; --ink-2:#c3c2b7; --muted:#8f8d86;
  --grid:#2c2c2a; --axis:#3a3a37; --line:#2e2e2b; --line-2:#232321;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --warn:#fab219;
  --sel:#e8574f; --sel-wash:rgba(232,87,79,.13);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--plane);color:var(--ink);
  font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}

.app{display:flex;flex-direction:column;min-height:100%}

.bar{display:flex;align-items:center;gap:14px;padding:0 14px;height:46px;
  background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.bar h1{font-size:14px;font-weight:660;letter-spacing:-.01em;margin:0;white-space:nowrap}
.bar h1 em{font-style:normal;color:var(--sel)}
.bar .meta{font-size:11.5px;color:var(--muted);white-space:nowrap;
  font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.bar .sp{flex:1}
.tabs{display:flex;border:1px solid var(--line);overflow:hidden;flex:none}
.tabs button{appearance:none;border:0;border-right:1px solid var(--line);background:var(--panel);
  font:inherit;font-size:11.5px;color:var(--ink-2);padding:5px 11px;cursor:pointer;white-space:nowrap}
.tabs button:last-child{border-right:0}
.tabs button:hover{background:var(--plane)}
.tabs button[aria-selected=true]{background:var(--sel);color:#fff;font-weight:600}

.chips{display:flex;align-items:center;gap:6px;padding:5px 14px;min-height:31px;
  background:var(--rail);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.chips .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:660}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--sel-wash);
  color:var(--sel);border:1px solid currentColor;padding:1px 5px 1px 7px;font-weight:560}
.chip b{font-weight:560}
.chip button{appearance:none;border:0;background:none;color:inherit;cursor:pointer;
  font:inherit;font-size:13px;line-height:1;padding:0 1px;opacity:.7}
.chip button:hover{opacity:1}
.chips .none{font-size:11.5px;color:var(--muted)}
.chips .clr{appearance:none;border:0;background:none;color:var(--ink-2);font:inherit;
  font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0}

.body{display:flex;flex:1;min-height:0}
.rail{width:196px;flex:none;background:var(--rail);border-right:1px solid var(--line);
  overflow-y:auto;padding-bottom:20px}
.rail section{border-bottom:1px solid var(--line-2)}
.rail h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:660;margin:0;padding:9px 11px 5px}
.rail .opt{display:flex;align-items:center;gap:7px;padding:3px 11px;cursor:pointer;font-size:12px;
  color:var(--ink-2);line-height:1.3}
.rail .opt:hover{background:var(--plane);color:var(--ink)}
.rail .opt.on{color:var(--ink);font-weight:600}
.rail .opt .bx{width:11px;height:11px;border:1px solid var(--axis);border-radius:2px;flex:none;
  display:grid;place-items:center;font-size:9px;color:#fff;line-height:1}
.rail .opt.on .bx{background:var(--sel);border-color:var(--sel)}
.rail .opt .sw{width:8px;height:8px;border-radius:2px;flex:none}
.rail .opt .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail .opt .ct{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.canvas{flex:1;min-width:0;overflow-y:auto;padding:9px;display:none;flex-direction:column}
.canvas.on{display:flex}

.canvas > .row:last-of-type{flex:1;min-height:0}
.canvas > .row:last-of-type .pnl{min-height:0}
.canvas > .row:last-of-type .in{overflow-y:auto}

.kpis{display:flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);margin-bottom:9px}
.kpi{flex:1 1 154px;padding:8px 12px;border-right:1px solid var(--line-2);
  border-bottom:1px solid var(--line-2);min-width:154px}
.kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:660;white-space:nowrap}
.kpi .v{font-size:21px;font-weight:660;letter-spacing:-.02em;line-height:1.15;margin-top:2px;
  font-variant-numeric:tabular-nums}
.kpi .n{font-size:10.5px;color:var(--muted);margin-top:1px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.kpi.warnk .v{color:var(--warn)}

.row{display:grid;gap:9px;margin-bottom:9px}
.r-2{grid-template-columns:1fr 1fr}
.r-3{grid-template-columns:1fr 1fr 1fr}
.r-64{grid-template-columns:6fr 4fr}
.r-73{grid-template-columns:7fr 3fr}
@media(max-width:900px){.r-2,.r-3,.r-64,.r-73{grid-template-columns:1fr}}

@media(max-width:720px){
  .body{flex-direction:column}
  .rail{width:auto;max-height:132px;border-right:0;border-bottom:1px solid var(--line)}
}
.pnl{background:var(--panel);border:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
.pnl > h2{font-size:11px;text-transform:uppercase;letter-spacing:.055em;color:var(--ink-2);
  font-weight:680;margin:0;padding:6px 10px;border-bottom:1px solid var(--line-2);
  display:flex;align-items:baseline;gap:8px}
.pnl > h2 span{font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);font-size:10.5px}
.pnl > h2 .unf{margin-left:auto;color:var(--warn);font-weight:640;white-space:nowrap;
  border:1px solid currentColor;padding:0 6px;font-size:9.5px;
  text-transform:uppercase;letter-spacing:.04em}
td a{color:var(--sel);text-decoration:none}
td a:hover{text-decoration:underline}
.pnl .def{font-size:10.5px;color:var(--muted);padding:5px 10px 0;line-height:1.35}
.pnl .in{padding:8px 10px 10px;flex:1;min-width:0;overflow-x:auto}

.foot{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;padding:5px 14px;
  min-height:28px;background:var(--panel);border-top:1px solid var(--line);
  font-size:10.5px;color:var(--muted);flex:none}
.foot b{color:var(--ink-2);font-weight:660;text-transform:uppercase;letter-spacing:.05em;font-size:9.5px}
.foot .sp{flex:1}
svg{display:block;max-width:100%}
.gl{stroke:var(--grid);stroke-width:1}
.ax{stroke:var(--axis);stroke-width:1}
.tick{fill:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
.vlab{fill:var(--ink-2);font-size:10px;font-variant-numeric:tabular-nums;font-weight:600}
.clab{fill:var(--ink-2);font-size:10.5px}
.mark{cursor:pointer}
.mark:hover{opacity:.75}
.mark.dim{opacity:.22}

.lg{display:flex;gap:11px;flex-wrap:wrap;margin-top:7px;font-size:10.5px;color:var(--ink-2)}
.lg span{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.lg span.dim{opacity:.4}
.lg i{width:9px;height:9px;border-radius:2px;flex:none;display:block}

table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:11.5px;line-height:1.35}
thead th{position:sticky;top:0;background:var(--panel);text-align:left;padding:4px 7px;
  color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em;
  font-weight:660;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
tbody td{padding:2px 7px;border-bottom:1px solid var(--line-2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sel-wash)}
tbody tr.on{background:var(--sel-wash);font-weight:600}

td.mag .bw{position:relative;display:block;overflow:hidden}
td.mag .bw i{position:absolute;left:0;top:0;bottom:0;background:var(--s1);opacity:.15;display:block}
td.mag .bw span{position:relative}
.scroll{max-height:288px;overflow-y:auto}

.tip{position:fixed;pointer-events:none;background:var(--panel);color:var(--ink);
  border:1px solid var(--line);padding:6px 9px;font-size:11.5px;
  box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:0;transition:opacity .08s;z-index:99;max-width:260px}
.tip .t{font-weight:660;margin-bottom:2px}
.tip .r{color:var(--ink-2);font-variant-numeric:tabular-nums}

.qtbl td{white-space:normal}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;
  border:1px solid currentColor;white-space:nowrap}
.q-ok{color:var(--good)} .q-warn{color:var(--warn)} .q-fail{color:var(--crit)} .q-blocked{color:var(--s7)}

.prose{max-width:78ch;font-size:12.5px;color:var(--ink-2);padding:2px 2px 30px}
.prose h3{color:var(--ink);font-size:12.5px;font-weight:680;margin:16px 0 5px}
.prose p{margin:0 0 9px} .prose ul{margin:0 0 9px;padding-left:17px} .prose li{margin-bottom:4px}
.prose code{background:var(--plane);padding:1px 4px;border-radius:3px;font-size:11.5px}
.prose b{color:var(--ink)}
.note{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--sel);
  padding:8px 11px;margin-bottom:9px;font-size:11.5px;color:var(--ink-2)}
.note b{color:var(--ink)}
.note code{background:var(--plane);padding:1px 4px;border-radius:3px}
</style>
</head>

const S=['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'].map(v=>`var(${v})`);

const SRC_ORDER=['soundboard','audience','matrix','fm','unclassified'];
const SRC_COLOR=Object.fromEntries(SRC_ORDER.map((k,i)=>[k,S[i]]));
const LIN_LABEL={documented:'Lineage documented',undocumented:'No lineage'};

const fmt=n=>n==null?'—':Math.round(n).toLocaleString('en-US');
const kfmt=n=>n==null?'—':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?Math.round(n/1e3)+'k':fmt(n);
const pctS=(a,b)=>b?(100*a/b).toFixed(1)+'%':'—';
const eur=n=>n==null?'—':'€'+kfmt(n);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const NS='http://www.w3.org/2000/svg';
const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};

function inflate(b){
  if(!b||!b.rows) return [];
  return b.rows.map(r=>{
    const o={};
    b.cols.forEach((c,i)=>{ o[c] = (b.dict[c] ? b.dict[c][r[i]] : r[i]); });
    return o;
  });
}
const CUBE={
  main:inflate(DATA.cubes.main),
  venue:inflate(DATA.cubes.venue),
  accession:inflate(DATA.cubes.accession),
};
const CAPS=DATA.cubes.caps;

const F={year:new Set(),src:new Set(),state:new Set(),lineage:new Set()};
const DIMS={year:'year',src:'source_type',state:'state',lineage:'lineage'};

function match(row,except){
  for(const d in F){
    if(d===except||!F[d].size) continue;
    const col=DIMS[d]; if(!(col in row)) continue;
    if(!F[d].has(String(row[col]))) return false;
  }
  return true;
}
const sel=(cube,except)=>CUBE[cube].filter(r=>match(r,except));

function agg(rows,key,measures=['n']){
  const out=new Map();
  for(const r of rows){
    const k=r[key];
    let o=out.get(k); if(!o){o={key:k};measures.forEach(m=>o[m]=0);out.set(k,o)}
    measures.forEach(m=>o[m]+=(r[m]||0));
  }
  return [...out.values()];
}
const total=(rows,m='n')=>rows.reduce((s,r)=>s+(r[m]||0),0);

function toggle(dim,val){
  const v=String(val), s=F[dim];
  s.has(v)?s.delete(v):s.add(v);
  render();
}
const clearAll=()=>{Object.values(F).forEach(s=>s.clear());render()};

const tipEl=document.getElementById('tip');
function bind(node,title,rows){
  node.addEventListener('mouseenter',e=>{
    tipEl.innerHTML=`<div class="t">${esc(title)}</div>`+rows.map(r=>`<div class="r">${esc(r)}</div>`).join('');
    tipEl.style.opacity=1;move(e);
  });
  node.addEventListener('mousemove',move);
  node.addEventListener('mouseleave',()=>tipEl.style.opacity=0);
  function move(e){
    const p=12,w=tipEl.offsetWidth,h=tipEl.offsetHeight;
    let x=e.clientX+p,y=e.clientY+p;
    if(x+w>innerWidth-8)x=e.clientX-w-p;
    if(y+h>innerHeight-8)y=e.clientY-h-p;
    tipEl.style.left=x+'px';tipEl.style.top=y+'px';
  }
}

const DIM_LABEL={year:'year',src:'source type',state:'state',lineage:'lineage'};
function unsupported(cubeName){
  if(!cubeName) return [];
  const cols=DATA.cubes[cubeName]?.cols||[];
  return Object.keys(F).filter(d=>F[d].size && !cols.includes(DIMS[d])).map(d=>DIM_LABEL[d]);
}

function panel(host,title,note,cubeName,def){
  const p=el('div','pnl');
  const miss=unsupported(cubeName);
  const warn=miss.length?`<span class="unf" title="This panel's data is not stored at that grain.">not filtered by ${miss.join(' or ')}</span>`:'';
  p.appendChild(el('h2',null,esc(title)+(note?`<span>${esc(note)}</span>`:'')+warn));
  
  if(def) p.appendChild(el('div','def',def));
  const inner=el('div','in'); p.appendChild(inner); host.appendChild(p);
  return inner;
}

function hbar(host,rows,o={}){
  const {value='n',fmtv=fmt,lw=150,rh=17,dim=null,color=null,tip=null,max:mx=null}=o;
  if(!rows.length){host.appendChild(el('div','',`<span style="font-size:11px;color:var(--muted)">No rows match the current filter.</span>`));return}
  const max=mx??Math.max(...rows.map(r=>+r[value]||0),1);
  const W=660,R=62,H=rows.length*rh+4;
  const svg=mk('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  const budget=Math.floor((lw-12)/5.6);
  rows.forEach((r,i)=>{
    const y=i*rh+2, bh=rh-5;
    const w=Math.max(1.5,(W-lw-R)*(+r[value]||0)/max);
    const raw=String(r.key??r.label??'');
    const t=mk('text',{x:lw-8,y:y+bh/2+4,'text-anchor':'end',class:'clab'});
    t.textContent=raw.length>budget?raw.slice(0,budget-1).trimEnd()+'…':raw;
    svg.appendChild(t);
    const active=dim&&F[dim].size&&!F[dim].has(String(r.key));
    const g=mk('rect',{x:lw,y,width:w,height:bh,rx:2,fill:color?color(r):S[0],
      class:'mark'+(active?' dim':'')});
    svg.appendChild(g);
    bind(g,raw,tip?tip(r):[`${fmtv(r[value])}`]);
    if(dim) g.addEventListener('click',()=>toggle(dim,r.key));
    const v=mk('text',{x:lw+w+6,y:y+bh/2+4,class:'vlab'});
    v.textContent=fmtv(r[value]); svg.appendChild(v);
  });
  host.appendChild(svg);
}

function stack100(host,cats,series,o={}){
  
  const {colors={},tip=null,dim=null,unit='items'}=o;
  const W=660,H=196,L=34,R=8,T=8,B=26;
  const svg=mk('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  for(let i=0;i<=4;i++){
    const y=T+(H-T-B)*(1-i/4);
    svg.appendChild(mk('line',{x1:L,x2:W-R,y1:y,y2:y,class:'gl'}));
    const t=mk('text',{x:L-6,y:y+3.5,'text-anchor':'end',class:'tick'});
    t.textContent=(i*25)+'%'; svg.appendChild(t);
  }
  svg.appendChild(mk('line',{x1:L,x2:W-R,y1:H-B,y2:H-B,class:'ax'}));
  
  const slot=(W-L-R)/cats.length;
  const bw=Math.max(3,Math.min(74,slot-(slot>28?20:4)));
  cats.forEach((c,ci)=>{
    const cx=L+(W-L-R)*(ci+.5)/cats.length;
    const tot=series.reduce((s,k)=>s+(c.v[k]||0),0)||1;
    let acc=0;
    series.forEach(k=>{
      const val=c.v[k]||0; if(!val) return;
      const h=(H-T-B)*val/tot, y=(H-B)-((H-T-B)*acc/tot)-h;
      const active=dim&&F[dim].size&&!F[dim].has(k);
      const r=mk('rect',{x:cx-bw/2,y:y+1,width:bw,height:Math.max(1,h-2),rx:2,
        fill:colors[k]||S[0],class:'mark'+(active?' dim':'')});
      svg.appendChild(r);
      bind(r,`${c.k} · ${k}`,[`${fmt(val)} ${unit}`,`${pctS(val,tot)} of ${fmt(tot)}`]);
      if(dim) r.addEventListener('click',()=>toggle(dim,k));
      acc+=val;
    });
    const t=mk('text',{x:cx,y:H-B+14,'text-anchor':'middle',class:'tick'});
    t.textContent=c.k; svg.appendChild(t);
    
    if(cats.length<=12){
      const n=mk('text',{x:cx,y:H-B+24,'text-anchor':'middle',class:'tick'});
      n.setAttribute('style','font-size:9px'); n.textContent=fmt(tot); svg.appendChild(n);
    }
  });
  host.appendChild(svg);
}

function legend(host,items,dim){
  const d=el('div','lg');
  items.forEach(([label,color])=>{
    const active=dim&&F[dim].size&&!F[dim].has(label);
    const s=el('span',active?'dim':'',`<i style="background:${color}"></i>${esc(label)}`);
    if(dim) s.onclick=()=>toggle(dim,label);
    d.appendChild(s);
  });
  host.appendChild(d);
}

function table(host,rows,cols,o={}){
  const {dim=null,keyf=r=>r.key,scroll=true}=o;
  const wrap=el('div',scroll?'scroll':'');
  const t=el('table');
  t.innerHTML='<thead><tr>'+cols.map(c=>`<th class="${c.n?'n':''}" ${c.w?`style="width:${c.w}"`:''}>${esc(c.h)}</th>`).join('')+'</tr></thead>';
  const tb=el('tbody');
  const maxes={};
  cols.forEach(c=>{if(c.bar)maxes[c.k]=Math.max(...rows.map(r=>+r[c.k]||0),1)});
  rows.forEach(r=>{
    const tr=el('tr');
    if(dim&&F[dim].has(String(keyf(r)))) tr.className='on';
    cols.forEach(c=>{
      const td=el('td',(c.n?'n':'')+(c.bar?' mag':''));
      const val=c.f?c.f(r):esc(r[c.k]);
      td.innerHTML=c.bar
        ? `<span class="bw"><i style="width:${100*(+r[c.k]||0)/maxes[c.k]}%"></i><span>${val}</span></span>`
        : val;
      tr.appendChild(td);
    });
    if(dim) tr.onclick=()=>toggle(dim,keyf(r));
    tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t); host.appendChild(wrap);
}

function renderRail(){
  const rail=document.getElementById('rail'); rail.innerHTML='';
  const add=(title,dim,rows,colorf)=>{
    if(!rows.length) return;
    const s=el('section'); s.appendChild(el('h3',null,esc(title)));
    rows.forEach(r=>{
      const on=F[dim].has(String(r.key));
      const o=el('div','opt'+(on?' on':''));
      o.innerHTML=`<span class="bx">${on?'✓':''}</span>`+
        (colorf?`<span class="sw" style="background:${colorf(r)}"></span>`:'')+
        `<span class="nm">${esc(r.label??r.key)}</span><span class="ct">${fmt(r.n)}</span>`;
      o.onclick=()=>toggle(dim,r.key);
      s.appendChild(o);
    });
    rail.appendChild(s);
  };
  
  const yrs=agg(sel('main','year'),'year').sort((a,b)=>a.key-b.key);
  const dec={};
  yrs.forEach(r=>{const d=Math.floor(r.key/10)*10; dec[d]=(dec[d]||0)+r.n});
  const decSec=el('section'); decSec.appendChild(el('h3',null,'Decade'));
  Object.entries(dec).sort().forEach(([d,n])=>{
    const years=yrs.filter(r=>Math.floor(r.key/10)*10==+d).map(r=>String(r.key));
    const on=years.every(y=>F.year.has(y)) && years.length>0;
    const o=el('div','opt'+(on?' on':''));
    o.innerHTML=`<span class="bx">${on?'✓':''}</span><span class="nm">${d}s</span><span class="ct">${fmt(n)}</span>`;
    o.onclick=()=>{ years.forEach(y=>on?F.year.delete(y):F.year.add(y)); render() };
    decSec.appendChild(o);
  });
  rail.appendChild(decSec);

  add('Source type','src',
      SRC_ORDER.map(k=>agg(sel('main','src'),'source_type').find(r=>r.key===k)).filter(Boolean),
      r=>SRC_COLOR[r.key]);
  add('Provenance','lineage',
      ['documented','undocumented'].map(k=>{
        const r=agg(sel('main','lineage'),'lineage').find(x=>x.key===k);
        return r?{...r,label:LIN_LABEL[k]}:null}).filter(Boolean));
  add('State / country','state',
      agg(sel('main','state'),'state').sort((a,b)=>b.n-a.n).slice(0,14));
}

function renderChips(){
  const c=document.getElementById('chips'); c.innerHTML='';
  c.appendChild(el('span','lbl','Filters'));
  let any=false;
  const label={year:'Year',src:'Source',state:'Place',lineage:'Provenance'};
  for(const dim in F){
    [...F[dim]].forEach(v=>{

      const chip=el('span','chip',`${label[dim]} <b>${esc(dim==='lineage'?LIN_LABEL[v]:v)}</b>`);

      chip.appendChild(b); c.appendChild(chip);
    });
  }
  if(!any) c.appendChild(el('span','none',
    `none — showing all ${fmt(DATA.totals.recordings)} recordings. Click any bar, row or legend swatch to filter.`));
  else{const b=el('button','clr','clear all');b.onclick=clearAll;c.appendChild(b)}
}

function kpis(host){
  const rows=sel('main');
  const n=total(rows), loss=total(rows,'lossless'), dl=total(rows,'downloads');
  const lin=total(rows.filter(r=>r.lineage==='documented'));
  const cls=total(rows.filter(r=>r.source_type!=='unclassified'));
  const T=DATA.totals, ST=DATA.show_totals;
  const strip=el('div','kpis');
  const k=(key,val,note,c)=>strip.appendChild(el('div','kpi'+(c?' '+c:''),
    `<div class="k">${key}</div><div class="v">${val}</div><div class="n">${note}</div>`));
  k('Recordings',fmt(n),`${fmt(dl)} downloads`);
  k('Performances',fmt(ST.shows),`${ST.avg_recordings} recordings each on average`);
  k('Venues',fmt(T.venues),`${T.first_year}–${T.last_year}`);
  k('Lossless copy',pctS(loss,n),`${fmt(n-loss)} lossy-only`);
  k('Source classified',pctS(cls,n),`${fmt(n-cls)} unrecognised chains`,cls/n<0.9?'warnk':'');
  k('Provenance documented',pctS(lin,n),`${fmt(n-lin)} with no lineage`,lin/n<0.8?'warnk':'');
  host.appendChild(strip);
}

function renderOverview(){
  const c=document.getElementById('c-overview'); c.innerHTML='';
  kpis(c);

  const r1=el('div','row r-64'); c.appendChild(r1);
  const yrs=agg(sel('main','src'),'year').sort((a,b)=>a.key-b.key).map(r=>r.key);
  const cats=yrs.map(y=>({k:String(y).slice(2),v:Object.fromEntries(
    agg(sel('main','src').filter(r=>r.year===y),'source_type').map(r=>[r.key,r.n]))}));
  const present=SRC_ORDER.filter(k=>cats.some(x=>x.v[k]));
  const p1=panel(r1,'Surviving recordings by year and source type','share per year',null,
    'Each bar is normalised to 100%; the count beneath is the unnormalised total. Source type is inferred from the free-text recording chain — see Method.');
  stack100(p1,cats,present,{colors:SRC_COLOR,dim:'src',unit:'recordings'});
  legend(p1,present.map(k=>[k,SRC_COLOR[k]]),'src');

  const p2=panel(r1,'Source type','click to filter',null,
    'A matrix is a mix of soundboard and audience feeds, so its description mentions all three terms — it is therefore tested first.');
  const sRows=agg(sel('main','src'),'source_type',['n','lossless'])
    .sort((a,b)=>SRC_ORDER.indexOf(a.key)-SRC_ORDER.indexOf(b.key));
  const sTot=total(sRows);
  hbar(p2,sRows,{lw:96,rh:19,dim:'src',color:r=>SRC_COLOR[r.key]||S[0],
    tip:r=>[`${fmt(r.n)} recordings`,`${pctS(r.n,sTot)} of selection`,`${pctS(r.lossless,r.n)} lossless`]});

  const r2=el('div','row r-2'); c.appendChild(r2);
  const p3=panel(r2,'Archival redundancy','recordings surviving per performance',null,
    'How many independent tapes survive of each night. A performance with one recording has no fallback if that copy is lost or proves defective.');
  const order=['1','2','3-4','5-9','10-19','20+'];
  const red=DATA.redundancy.map(r=>({key:r.bucket,n:r.n}))
    .sort((a,b)=>order.indexOf(a.key)-order.indexOf(b.key));
  const redTot=red.reduce((s,r)=>s+r.n,0);
  hbar(p3,red,{lw:72,rh:19,tip:r=>[`${fmt(r.n)} performances`,`${pctS(r.n,redTot)} of all shows`]});

  const p4=panel(r2,'Venues',`top ${DATA.cubes.caps.venue} by recordings`,'venue',
    'variants is how many distinct raw spellings folded into this venue during normalization.');
  const vRows=agg(sel('venue'),'k',['n']).sort((a,b)=>b.n-a.n).slice(0,16);
  const vMeta=Object.fromEntries(DATA.top_venues.map(v=>[v.venue,v]));
  table(p4,vRows,[
    {h:'Venue',k:'key',f:r=>esc(r.key)},
    {h:'Recordings',k:'n',n:1,bar:1,w:'88px',f:r=>fmt(r.n)},
    {h:'Shows',k:'key',n:1,w:'56px',f:r=>fmt(vMeta[r.key]?.show_count)},
    {h:'Variants',k:'key',n:1,w:'62px',f:r=>fmt(vMeta[r.key]?.variant_count)},
    {h:'',k:'key',w:'52px',f:r=>vMeta[r.key]?.sample_url
      ? `<a href="${esc(vMeta[r.key].sample_url)}" target="_blank" rel="noopener">listen</a>` : ''}]);
}

function renderProvenance(){
  const c=document.getElementById('c-provenance'); c.innerHTML='';
  kpis(c);
  c.appendChild(el('div','note',
    '<b>Provenance is the chain of custody for the audio.</b> Depositors record it as free text — "Master cassette &gt; Sony D5 &gt; CDR &gt; FLAC". Without it, a transfer cannot be reconstructed or assessed, and the recording becomes a file with no history. Step counts measure how thoroughly the chain was <i>documented</i>, never how good the audio is.'));

  const r1=el('div','row r-2'); c.appendChild(r1);
  const p1=panel(r1,'Metadata completeness by decade',null,null,
    'Does older material carry worse metadata, or did documentation practice improve as the taping community formalised?');
  const dec=DATA.by_decade.map(d=>({key:d.decade+'s',
    lineage:100*d.lineage/d.n, taper:100*d.taper/d.n, classified:100*d.classified/d.n, n:d.n}));
  const cats=dec.map(d=>({k:d.key,v:{lineage:d.lineage,taper:d.taper,other:Math.max(0,100-d.lineage-d.taper)}}));
  hbar(p1,dec,{value:'lineage',lw:64,rh:20,max:100,fmtv:v=>v.toFixed(0)+'%',
    tip:r=>[`${fmt(r.n)} recordings`,`${r.lineage.toFixed(1)}% document a lineage`,
            `${r.taper.toFixed(1)}% credit a taper`,`${r.classified.toFixed(1)}% source classified`]});
  legend(p1,[['share documenting a transfer chain',S[0]]]);

  const p2=panel(r1,'Which rule classified each recording','provenance of the inference',null,
    'Every classification records the rule that produced it. "sbd+aud-ambiguous" is the assumption worth arguing with: both terms appear but no matrix is declared, and soundboard wins.');
  hbar(p2,DATA.source_rules.map(r=>({key:r.rule,n:r.n})),{lw:186,rh:18});

  const r2=el('div','row r-2'); c.appendChild(r2);
  const p3=panel(r2,'Tapers by recordings contributed',`top ${DATA.cubes.caps.taper}`,null,
    'Attribution is credited on 56% of items. These are the people who made the archive possible, where the metadata records them.');
  hbar(p3,DATA.top_tapers.map(t=>({key:t.taper,n:t.n,shows:t.shows})),{lw:170,rh:16,
    tip:r=>[`${fmt(r.n)} recordings`,`${fmt(r.shows)} distinct performances`]});

  const p4=panel(r2,'When recordings were deposited','accession year, not performance year',null,
    'The archive is not a snapshot — it accumulated over two decades of volunteer transfer work, and is still growing.');
  const acc=agg(sel('accession'),'added_year').sort((a,b)=>a.key-b.key);
  hbar(p4,acc,{lw:52,rh:14,tip:r=>[`${fmt(r.n)} items deposited in ${r.key}`]});
}

function renderQuality(){
  const c=document.getElementById('c-quality'); c.innerHTML='';
  const q=DATA.quality, n=s=>q.filter(r=>r.status===s).length;
  const strip=el('div','kpis');
  [['Passing',n('ok'),'above threshold'],['Warnings',n('warn'),'gap must stay visible'],
   ['Failures',n('fail'),'would mislead if charted'],['Blocked',n('blocked'),'not answerable from this data']]
   .forEach(([k,v,note])=>strip.appendChild(el('div','kpi',
     `<div class="k">${k}</div><div class="v">${v}</div><div class="n">${note}</div>`)));
  c.appendChild(strip);
  c.appendChild(el('div','note',
    '<b>Two of these checks validate this pipeline\'s own inference rather than the source.</b> Performances are not recorded in the archive — they are inferred by normalizing venue strings and grouping on date. The authority reconciliation is the only thing standing between that inference and an unverifiable claim.'));

  const wrap=el('div','pnl'); wrap.appendChild(el('h2',null,'All checks<span>worst first</span>'));
  const inner=el('div','in'); wrap.appendChild(inner); c.appendChild(wrap);
  const ICON={ok:'✓',warn:'!',fail:'✕',blocked:'⊘'};
  const t=el('table','qtbl');
  t.innerHTML='<thead><tr><th style="width:84px">Status</th><th style="width:250px">Check</th>'+
    '<th class="n" style="width:60px">Value</th><th>Detail</th></tr></thead>';
  const tb=el('tbody');
  q.forEach(r=>{
    const tr=el('tr'); tr.style.cursor='default';
    tr.innerHTML=`<td><span class="pill q-${r.status}">${ICON[r.status]||''} ${esc(r.status)}</span></td>`+
      `<td>${esc(r.check_name)}</td>`+
      `<td class="n">${r.total?(r.pct??0).toFixed(1)+'%':'—'}</td>`+
      `<td style="color:var(--ink-2)">${esc(r.detail)}</td>`;
    tb.appendChild(tr);
  });
  t.appendChild(tb); inner.appendChild(t);
}

function renderSongs(){
  const c=document.getElementById('c-songs'); c.innerHTML='';
  const T=DATA.totals, songs=DATA.top_songs, agr=DATA.agreement;
  const multi=agr.reduce((s,r)=>s+r.n,0);

  const strip=el('div','kpis');
  const k=(key,val,note,cls)=>strip.appendChild(el('div','kpi'+(cls?' '+cls:''),
    `<div class="k">${key}</div><div class="v">${val}</div><div class="n">${note}</div>`));
  const parsedRec=DATA.quality.find(q=>q.check_name==='setlist.extracted');
  k('Setlists extracted',(parsedRec?parsedRec.pct.toFixed(1):'—')+'%','from free-text descriptions');
  k('Distinct songs',fmt(DATA.quality.find(q=>q.check_name==='setlist.song_authority')?.total),'after variant collapse');
  k('Nights with 2+ setlists',fmt(multi),'independently transcribed');
  
  const MID={'0.9-1.0':0.95,'0.75-0.9':0.825,'0.6-0.75':0.675,'0.4-0.6':0.5,'below 0.4':0.25};
  const wmean=multi?agr.reduce((s,r)=>s+(MID[r.band]||0)*r.n,0)/multi:0;
  k('Mean agreement',wmean.toFixed(2),'majority consensus vs union','warnk');
  c.appendChild(strip);

  c.appendChild(el('div','note',
    '<b>These are transcriptions, not an authority.</b> Each setlist was typed by the person who taped or transferred that recording. Where several people taped one night, their setlists frequently disagree — and nothing in this data says which is right. Rather than synthesise a single "correct" setlist and present it as fact, the pipeline records the <i>shape</i> of the disagreement so a curator can go and look.'));

  const r1=el('div','row r-2'); c.appendChild(r1);
  const p1=panel(r1,'Most performed songs','by distinct nights played',null,
    'Counted on distinct performances, not on setlist mentions — otherwise a night with sixteen surviving tapes would count sixteen times.');
  table(p1,songs.slice(0,18).map(x=>({key:x.title,...x})),[
    {h:'Song',k:'key',f:r=>esc(r.key)},
    {h:'Nights',k:'play_count',n:1,bar:1,w:'74px',f:r=>fmt(r.play_count)},
    {h:'First',k:'first_year',n:1,w:'52px'},
    {h:'Last',k:'last_year',n:1,w:'50px'},
    {h:'Spellings',k:'variant_count',n:1,w:'66px'}]);

  const p2=panel(r1,'How well do independent transcriptions agree?','shows with 2+ setlists',null,
    'Agreement is majority-consensus songs divided by the union of all songs anyone listed. 1.0 means every taper wrote the same set.');
  const order=['0.9-1.0','0.75-0.9','0.6-0.75','0.4-0.6','below 0.4'];
  const bands=agr.map(r=>({key:r.band,n:r.n})).sort((a,b)=>order.indexOf(a.key)-order.indexOf(b.key));
  hbar(p2,bands,{lw:82,rh:20,tip:r=>[`${fmt(r.n)} performances`,`${pctS(r.n,multi)} of reconciled nights`]});

  const r2=el('div','row'); c.appendChild(r2);
  const p3=panel(r2,'Most contested nights','4+ transcriptions, lowest agreement first',null,
    'Low agreement is not proof the tapers were careless. Partial recordings, multi-night runs deposited under one date, and this pipeline\'s own parse failures all land here. It is a queue for human attention, not a verdict.');
  table(p3,DATA.contested,[
    {h:'Date',k:'date',w:'92px'},
    {h:'Venue',k:'venue',f:r=>esc(r.venue)},
    {h:'City',k:'city',w:'130px',f:r=>esc([r.city,r.state].filter(Boolean).join(', '))},
    {h:'Setlists',k:'setlists_available',n:1,w:'66px'},
    {h:'Agreed',k:'consensus_songs',n:1,w:'62px'},
    {h:'Disputed',k:'disputed_songs',n:1,w:'70px',f:r=>fmt(r.disputed_songs)},
    {h:'Agreement',k:'agreement',n:1,bar:1,w:'82px',f:r=>(r.agreement??0).toFixed(2)},
    {h:'',k:'best_url',w:'52px',f:r=>r.best_url
      ? `<a href="${esc(r.best_url)}" target="_blank" rel="noopener">listen</a>` : ''}],
    {scroll:true});
}

const CANVAS={overview:renderOverview,songs:renderSongs,provenance:renderProvenance,
              quality:renderQuality};
let current='overview';

function render(){
  renderChips(); renderRail();
  document.querySelectorAll('#tabs button').forEach(
    b=>b.setAttribute('aria-selected', b.dataset.t===current));
  CANVAS[current]();
  document.querySelectorAll('.canvas').forEach(c=>c.classList.toggle('on',c.dataset.c===current));
  document.getElementById('rail').style.display=
    (current==='quality'||current==='songs')?'none':'';
}

const TABS=[['overview','Overview'],['songs','Songs & setlists'],
            ['provenance','Provenance & people'],['quality','Data quality']];
const tabs=document.getElementById('tabs');
tabs.innerHTML=TABS.map(([k,l],i)=>`<button data-t="${k}" aria-selected="${i===0}">${l}</button>`).join('');
tabs.onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  current=b.dataset.t;
  tabs.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',x===b));
  render();
};

const M=DATA.meta,T=DATA.totals,h0=DATA.harvests[0]||{};
document.getElementById('meta').textContent=
  `${fmt(T.recordings)} recordings · ${fmt(DATA.show_totals.shows)} performances · ${T.first_year}–${T.last_year} · Internet Archive collection "${M.collection}"`;
document.getElementById('foot').innerHTML=
  `<span><b>Source</b> Internet Archive Live Music Archive · taper-permitted, freely redistributable</span>`+
  `<span><b>Coverage</b> ${fmt(T.recordings)} items · ${pctS(T.classified,T.recordings)} source-classified · ${pctS(T.with_lineage,T.recordings)} with lineage</span>`+
  `<span><b>Harvest</b> ${fmt(h0.recording_count)} items in ${h0.api_calls||'?'} API calls · built ${M.generated_at}</span>`+
  `<div class="sp"></div>`+
  `<span>Independent portfolio project · not affiliated with the Internet Archive</span>`;

render();
</script>
