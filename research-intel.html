<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stanford Research Output — Data Manager demo</title>
<style>
:root{
  color-scheme: light;
  --surface:#fcfcfb; --plane:#f4f4f1; --panel:#ffffff; --rail:#f7f7f5;
  --ink:#0b0b0b; --ink-2:#52514e;
  
  --muted:#6f6e69;
  --grid:#e1e0d9; --axis:#c3c2b7; --line:#dcdbd4; --line-2:#ebeae4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#0ca30c; --warn:#8a6200; --crit:#d03b3b;
  --sel:#8C1515; --sel-wash:rgba(140,21,21,.08);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme=light])){
    color-scheme: dark;
    --surface:#141413; --plane:#0b0b0a; --panel:#1a1a19; --rail:#161615;
    --ink:#fff; --ink-2:#c3c2b7; --muted:#8f8d86;
    --grid:#2c2c2a; --axis:#3a3a37; --line:#2e2e2b; --line-2:#232321;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --warn:#fab219;
    --sel:#e8574f; --sel-wash:rgba(232,87,79,.13);
  }
}
:root[data-theme=dark]{
  color-scheme: dark;
  --surface:#141413; --plane:#0b0b0a; --panel:#1a1a19; --rail:#161615;
  --ink:#fff; --ink-2:#c3c2b7; --muted:#8f8d86;
  --grid:#2c2c2a; --axis:#3a3a37; --line:#2e2e2b; --line-2:#232321;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --warn:#fab219;
  --sel:#e8574f; --sel-wash:rgba(232,87,79,.13);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--plane);color:var(--ink);
  font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}

.app{display:flex;flex-direction:column;min-height:100%}

.bar{display:flex;align-items:center;gap:14px;padding:0 14px;height:46px;
  background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.bar h1{font-size:14px;font-weight:660;letter-spacing:-.01em;margin:0;white-space:nowrap}
.bar h1 em{font-style:normal;color:var(--sel)}
.bar .meta{font-size:11.5px;color:var(--muted);white-space:nowrap;
  font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.bar .sp{flex:1}
.tabs{display:flex;border:1px solid var(--line);overflow:hidden;flex:none}
.tabs button{appearance:none;border:0;border-right:1px solid var(--line);background:var(--panel);
  font:inherit;font-size:11.5px;color:var(--ink-2);padding:5px 11px;cursor:pointer;white-space:nowrap}
.tabs button:last-child{border-right:0}
.tabs button:hover{background:var(--plane)}
.tabs button[aria-selected=true]{background:var(--sel);color:#fff;font-weight:600}

.chips{display:flex;align-items:center;gap:6px;padding:5px 14px;min-height:31px;
  background:var(--rail);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.chips .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:660}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--sel-wash);
  color:var(--sel);border:1px solid currentColor;padding:1px 5px 1px 7px;font-weight:560}
.chip b{font-weight:560}
.chip button{appearance:none;border:0;background:none;color:inherit;cursor:pointer;
  font:inherit;font-size:13px;line-height:1;padding:0 1px;opacity:.7}
.chip button:hover{opacity:1}
.chips .none{font-size:11.5px;color:var(--muted)}
.chips .clr{appearance:none;border:0;background:none;color:var(--ink-2);font:inherit;
  font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0}

.body{display:flex;flex:1;min-height:0}
.rail{width:196px;flex:none;background:var(--rail);border-right:1px solid var(--line);
  overflow-y:auto;padding-bottom:20px}
.rail section{border-bottom:1px solid var(--line-2)}
.rail h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:660;margin:0;padding:9px 11px 5px}
.rail .opt{display:flex;align-items:center;gap:7px;padding:3px 11px;cursor:pointer;font-size:12px;
  color:var(--ink-2);line-height:1.3}
.rail .opt:hover{background:var(--plane);color:var(--ink)}
.rail .opt.on{color:var(--ink);font-weight:600}
.rail .opt .bx{width:11px;height:11px;border:1px solid var(--axis);border-radius:2px;flex:none;
  display:grid;place-items:center;font-size:9px;color:#fff;line-height:1}
.rail .opt.on .bx{background:var(--sel);border-color:var(--sel)}
.rail .opt .sw{width:8px;height:8px;border-radius:2px;flex:none}
.rail .opt .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail .opt .ct{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.canvas{flex:1;min-width:0;overflow-y:auto;padding:9px;display:none;flex-direction:column}
.canvas.on{display:flex}

.canvas > .row:last-of-type{flex:1;min-height:0}
.canvas > .row:last-of-type .pnl{min-height:0}
.canvas > .row:last-of-type .in{overflow-y:auto}

.kpis{display:flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);margin-bottom:9px}
.kpi{flex:1 1 154px;padding:8px 12px;border-right:1px solid var(--line-2);
  border-bottom:1px solid var(--line-2);min-width:154px}
.kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:660;white-space:nowrap}
.kpi .v{font-size:21px;font-weight:660;letter-spacing:-.02em;line-height:1.15;margin-top:2px;
  font-variant-numeric:tabular-nums}
.kpi .n{font-size:10.5px;color:var(--muted);margin-top:1px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.kpi.warnk .v{color:var(--warn)}

.row{display:grid;gap:9px;margin-bottom:9px}
.r-2{grid-template-columns:1fr 1fr}
.r-3{grid-template-columns:1fr 1fr 1fr}
.r-64{grid-template-columns:6fr 4fr}
.r-73{grid-template-columns:7fr 3fr}
@media(max-width:900px){.r-2,.r-3,.r-64,.r-73{grid-template-columns:1fr}}

@media(max-width:720px){
  .body{flex-direction:column}
  .rail{width:auto;max-height:132px;border-right:0;border-bottom:1px solid var(--line)}
}
.pnl{background:var(--panel);border:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
.pnl > h2{font-size:11px;text-transform:uppercase;letter-spacing:.055em;color:var(--ink-2);
  font-weight:680;margin:0;padding:6px 10px;border-bottom:1px solid var(--line-2);
  display:flex;align-items:baseline;gap:8px}
.pnl > h2 span{font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);font-size:10.5px}
.pnl > h2 .unf{margin-left:auto;color:var(--warn);font-weight:640;white-space:nowrap;
  border:1px solid currentColor;padding:0 6px;font-size:9.5px;
  text-transform:uppercase;letter-spacing:.04em}
.pnl .def{font-size:10.5px;color:var(--muted);padding:5px 10px 0;line-height:1.35}
.pnl .in{padding:8px 10px 10px;flex:1;min-width:0;overflow-x:auto}

.foot{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;padding:5px 14px;
  min-height:28px;background:var(--panel);border-top:1px solid var(--line);
  font-size:10.5px;color:var(--muted);flex:none}
.foot b{color:var(--ink-2);font-weight:660;text-transform:uppercase;letter-spacing:.05em;font-size:9.5px}
.foot .sp{flex:1}
svg{display:block;max-width:100%}
.gl{stroke:var(--grid);stroke-width:1}
.ax{stroke:var(--axis);stroke-width:1}
.tick{fill:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
.vlab{fill:var(--ink-2);font-size:10px;font-variant-numeric:tabular-nums;font-weight:600}
.clab{fill:var(--ink-2);font-size:10.5px}
.mark{cursor:pointer}
.mark:hover{opacity:.75}
.mark.dim{opacity:.22}

.lg{display:flex;gap:11px;flex-wrap:wrap;margin-top:7px;font-size:10.5px;color:var(--ink-2)}
.lg span{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.lg span.dim{opacity:.4}
.lg i{width:9px;height:9px;border-radius:2px;flex:none;display:block}

table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:11.5px;line-height:1.35}
thead th{position:sticky;top:0;background:var(--panel);text-align:left;padding:4px 7px;
  color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em;
  font-weight:660;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
tbody td{padding:2px 7px;border-bottom:1px solid var(--line-2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sel-wash)}
tbody tr.on{background:var(--sel-wash);font-weight:600}

td.mag .bw{position:relative;display:block;overflow:hidden}
td.mag .bw i{position:absolute;left:0;top:0;bottom:0;background:var(--s1);opacity:.15;display:block}
td.mag .bw span{position:relative}
.scroll{max-height:288px;overflow-y:auto}

.tip{position:fixed;pointer-events:none;background:var(--panel);color:var(--ink);
  border:1px solid var(--line);padding:6px 9px;font-size:11.5px;
  box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:0;transition:opacity .08s;z-index:99;max-width:260px}
.tip .t{font-weight:660;margin-bottom:2px}
.tip .r{color:var(--ink-2);font-variant-numeric:tabular-nums}

.qtbl td{white-space:normal}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;
  border:1px solid currentColor;white-space:nowrap}
.q-ok{color:var(--good)} .q-warn{color:var(--warn)} .q-fail{color:var(--crit)} .q-blocked{color:var(--s7)}

.prose{max-width:78ch;font-size:12.5px;color:var(--ink-2);padding:2px 2px 30px}
.prose h3{color:var(--ink);font-size:12.5px;font-weight:680;margin:16px 0 5px}
.prose p{margin:0 0 9px} .prose ul{margin:0 0 9px;padding-left:17px} .prose li{margin-bottom:4px}
.prose code{background:var(--plane);padding:1px 4px;border-radius:3px;font-size:11.5px}
.prose b{color:var(--ink)}
.note{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--sel);
  padding:8px 11px;margin-bottom:9px;font-size:11.5px;color:var(--ink-2)}
.note b{color:var(--ink)}
.note code{background:var(--plane);padding:1px 4px;border-radius:3px}
</style>
</head>

</div>

        (colorf?`<span class="sw" style="background:${colorf(r)}"></span>`:'')+
        `<span class="nm">${esc(r.label??r.key)}</span><span class="ct">${fmt(r.n)}</span>`;
      o.onclick=()=>toggle(dim,r.key);
      s.appendChild(o);
    });
    rail.appendChild(s);
  };
  
  add('Year','year',agg(sel('main','year'),'pub_year').sort((a,b)=>a.key-b.key));
  add('Access route','oa',
      OA_ORDER.map(k=>agg(sel('main','oa'),'open_access').find(r=>r.key===k)).filter(Boolean),
      r=>OA_COLOR[r.key]);
  add('Federal funding','federal',
      ['yes','no','unknown'].map(k=>{
        const r=agg(sel('main','federal'),'federal').find(x=>x.key===k);
        return r?{...r,label:FED_LABEL[k]}:null;}).filter(Boolean));
  add('Field','field',agg(sel('main','field'),'field').sort((a,b)=>b.n-a.n).slice(0,16));
}

function renderChips(){
  const c=document.getElementById('chips'); c.innerHTML='';
  c.appendChild(el('span','lbl','Filters'));
  let any=false;
  const label={year:'Year',oa:'Route',field:'Field',federal:'Funding'};
  for(const dim in F){
    [...F[dim]].forEach(v=>{
      any=true;
      const chip=el('span','chip',`${label[dim]} <b>${esc(dim==='federal'?FED_LABEL[v]:v)}</b>`);
      const b=el('button',null,'×'); b.onclick=()=>toggle(dim,v);
      chip.appendChild(b); c.appendChild(chip);
    });
  }
  if(!any) c.appendChild(el('span','none','none — showing all 65,552 publications. Click any bar, row or legend swatch to filter.'));
  else{const b=el('button','clr','clear all');b.onclick=clearAll;c.appendChild(b)}
}

function kpis(host){
  const rows=sel('main');
  const n=total(rows), cites=total(rows,'cites');
  
  const nonPre=rows.filter(r=>r.open_access!=='preprint');
  const base=total(nonPre);
  const oa=total(nonPre.filter(r=>r.open_access!=='closed'));
  const pre=n-base;
  const apc=total(rows,'apc_charged');
  const charged=total(rows.filter(r=>r.open_access==='gold'||r.open_access==='hybrid'));
  const known=total(rows.filter(r=>r.federal!=='unknown'));
  const fed=total(rows.filter(r=>r.federal==='yes'));
  const strip=el('div','kpis');
  const k=(key,val,note,cls)=>strip.appendChild(el('div','kpi'+(cls?' '+cls:''),
    `<div class="k">${key}</div><div class="v">${val}</div><div class="n">${note}</div>`));
  k('Publications',fmt(n),`${fmt(cites)} citations`);
  k('Open access',pctS(oa,base),`${fmt(oa)} of ${fmt(base)}, excl. ${fmt(pre)} preprints`);
  k('Derived APC',eur(apc),`gold + hybrid · ${fmt(charged)} works`);
  k('Avg APC',charged?eur(apc/charged):'—','per charged work');
  k('Federally funded',pctS(fed,known),`${fmt(fed)} of ${fmt(known)} with funder data`);
  k('Funding unknown',pctS(n-known,n),`${fmt(n-known)} works lack funder data`,'warnk');
  host.appendChild(strip);
}

function renderOverview(){
  const c=document.getElementById('c-overview'); c.innerHTML='';
  kpis(c);

  const r1=el('div','row r-64'); c.appendChild(r1);
  const yrs=agg(sel('main','oa'),'pub_year').sort((a,b)=>a.key-b.key).map(r=>r.key);
  const cats=yrs.map(y=>({k:String(y),v:Object.fromEntries(
    agg(sel('main','oa').filter(r=>r.pub_year===y),'open_access').map(r=>[r.key,r.n]))}));
  const present=OA_ORDER.filter(k=>cats.some(x=>x.v[k]));
  const p1=panel(r1,'Access route mix by year','share of output',null,
    'OpenAlex assigns exactly one route per work. Bars are normalised to 100%; the count under each year is the unnormalised total.');
  stack100(p1,cats,present,{colors:OA_COLOR});
  legend(p1,present.map(k=>[k,OA_COLOR[k]]),'oa');

  const p2=panel(r1,'Access route','click to filter',null,
    'Absolute counts for the same routes shown at left. Preprints are reported as their own route, not as open access.');
  const oaRows=agg(sel('main','oa'),'open_access',['n','apc_all'])
    .sort((a,b)=>OA_ORDER.indexOf(a.key)-OA_ORDER.indexOf(b.key));
  const oaTot=total(oaRows);
  hbar(p2,oaRows,{lw:74,rh:19,dim:'oa',color:r=>OA_COLOR[r.key]||S[0],
    tip:r=>[`${fmt(r.n)} works`,`${pctS(r.n,oaTot)} of selection`,`${eur(r.apc_all)} derived APC`]});

  const r2=el('div','row r-2'); c.appendChild(r2);
  
  const p3=panel(r2,'Open access rate by field','fields with 200+ works · click to filter',null,
    'Share of each field\'s output outside the paywall, excluding preprints. Works with no OpenAlex topic are excluded — that bucket is not a field, and it ranks first if left in. Fields under 200 works are omitted as too small to rank.');
  const fAll=agg(sel('main','field'),'field',['n']);
  const fOA=agg(sel('main','field').filter(r=>r.open_access!=='closed'&&r.open_access!=='preprint'),'field',['n']);
  const fPre=agg(sel('main','field').filter(r=>r.open_access==='preprint'),'field',['n']);
  const oaBy=Object.fromEntries(fOA.map(r=>[r.key,r.n]));
  const preBy=Object.fromEntries(fPre.map(r=>[r.key,r.n]));
  const fRows=fAll.map(r=>{
      const base=r.n-(preBy[r.key]||0);
      return {key:r.key,n:r.n,base,oa:oaBy[r.key]||0,pc:base?100*(oaBy[r.key]||0)/base:0};
    }).filter(r=>r.base>=200 && r.key!=='(unclassified)')
      .sort((a,b)=>b.pc-a.pc).slice(0,16);
  hbar(p3,fRows,{value:'pc',lw:186,rh:16,dim:'field',max:100,fmtv:v=>v.toFixed(1)+'%',
    tip:r=>[`${fmt(r.oa)} of ${fmt(r.base)} works open access`,`${fmt(r.n)} total incl. preprints`]});

  const p4=panel(r2,'Journals',`top ${CAPS.journal} by volume`,'journal',
    'APC is the derived charge summed across the journal\'s works in the current selection; €0 means no charge was derived, not that publishing was free.');
  const jRows=agg(sel('journal'),'k',['n','apc']).sort((a,b)=>b.n-a.n).slice(0,18);
  table(p4,jRows,[
    {h:'Journal',k:'key',f:r=>esc(r.key)},
    {h:'Works',k:'n',n:1,bar:1,w:'74px',f:r=>fmt(r.n)},
    {h:'APC',k:'apc',n:1,w:'62px',f:r=>eur(r.apc)}]);
}

function renderAccess(){
  const c=document.getElementById('c-access'); c.innerHTML='';
  kpis(c);
  c.appendChild(el('div','note',
    '<b>Derived APC counts gold and hybrid only.</b> Summing charges across every route gives a total roughly 58% higher, but a third of that sits on <i>green</i> and <i>bronze</i> works — a repository copy or publisher discretion made those free to read, not an author payment. Per-route totals are in the table below.'));

  const r1=el('div','row r-2'); c.appendChild(r1);
  const p1=panel(r1,'Access route detail');
  const oaRows=agg(sel('main','oa'),'open_access',['n','apc_all','apc_charged','cites'])
    .sort((a,b)=>OA_ORDER.indexOf(a.key)-OA_ORDER.indexOf(b.key));
  const tot=total(oaRows);
  table(p1,oaRows,[
    {h:'Route',k:'key',f:r=>`<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${OA_COLOR[r.key]||S[0]};margin-right:6px"></span>${esc(r.key)}`},
    {h:'Works',k:'n',n:1,bar:1,w:'78px',f:r=>fmt(r.n)},
    {h:'Share',k:'n',n:1,w:'52px',f:r=>pctS(r.n,tot)},
    {h:'APC all',k:'apc_all',n:1,w:'66px',f:r=>eur(r.apc_all)},
    {h:'APC charged',k:'apc_charged',n:1,w:'78px',f:r=>eur(r.apc_charged)}],
    {dim:'oa',scroll:false});

  const p2=panel(r1,'How each APC figure was derived','provenance of every value');
  hbar(p2,DATA.apc_source.map(r=>({key:r.source,n:r.n})),{lw:230,rh:17});

  const r2=el('div','row r-2'); c.appendChild(r2);
  const p3=panel(r2,'Publishers by derived APC',`top ${CAPS.publisher}`,'publisher');
  const pubRows=agg(sel('publisher'),'k',['n','apc']).sort((a,b)=>b.apc-a.apc).slice(0,18);
  table(p3,pubRows,[
    {h:'Publisher',k:'key',f:r=>esc(r.key)},
    {h:'Works',k:'n',n:1,w:'60px',f:r=>fmt(r.n)},
    {h:'APC',k:'apc',n:1,bar:1,w:'80px',f:r=>eur(r.apc)}]);

  const p4=panel(r2,'Journals by derived APC',`top ${CAPS.journal}`,'journal');
  const jRows=agg(sel('journal'),'k',['n','apc']).sort((a,b)=>b.apc-a.apc).slice(0,18);
  table(p4,jRows,[
    {h:'Journal',k:'key',f:r=>esc(r.key)},
    {h:'Works',k:'n',n:1,w:'60px',f:r=>fmt(r.n)},
    {h:'APC',k:'apc',n:1,bar:1,w:'80px',f:r=>eur(r.apc)}]);
}

function renderFunding(){
  const c=document.getElementById('c-funding'); c.innerHTML='';
  kpis(c);
  c.appendChild(el('div','note',
    '<b>Unknown is not zero.</b> OpenAlex carries funder data for about 46% of these works. Works without it are reported as unknown rather than as "not federally funded" — collapsing them would turn a metadata-coverage number into a policy number. Federal status comes from a curated agency list, not a country filter: filtering on "US" alone sweeps in Pfizer, the Gates Foundation and Stanford itself.'));

  const r1=el('div','row r-2'); c.appendChild(r1);
  const p1=panel(r1,'Funders by publications supported',`top ${CAPS.funder} · many-to-many, sums exceed work count`,'funder');
  const fRows=agg(sel('funder'),'k',['n']).sort((a,b)=>b.n-a.n).slice(0,18);
  const fedBy=Object.fromEntries(CUBE.funder.map(r=>[r.k,r.federal_agency]));
  hbar(p1,fRows,{lw:212,rh:16,color:r=>fedBy[r.key]?S[0]:S[1],
    tip:r=>[`${fmt(r.n)} publications`,fedBy[r.key]?'US federal agency':'Not a US federal agency']});
  legend(p1,[['US federal agency',S[0]],['Other funder',S[1]]]);

  const p2=panel(r1,'Federal share by field','of works with funder data');
  const rows=sel('main','field');
  const byField={};
  rows.forEach(r=>{
    const f=byField[r.field]||(byField[r.field]={key:r.field,yes:0,known:0});
    if(r.federal!=='unknown'){f.known+=r.n; if(r.federal==='yes')f.yes+=r.n}
  });
  const ff=Object.values(byField).filter(f=>f.known>=100)
    .map(f=>({...f,pc:100*f.yes/f.known})).sort((a,b)=>b.pc-a.pc).slice(0,16);
  hbar(p2,ff,{value:'pc',lw:186,rh:16,fmtv:v=>v.toFixed(1)+'%',max:100,dim:'field',
    tip:r=>[`${fmt(r.yes)} of ${fmt(r.known)} works federally funded`]});

  const r2=el('div','row'); c.appendChild(r2);
  const p3=panel(r2,'Funding status by year','three states, never two');
  const yrs=agg(sel('main','federal'),'pub_year').sort((a,b)=>a.key-b.key).map(r=>r.key);
  const cats=yrs.map(y=>({k:String(y),v:Object.fromEntries(
    agg(sel('main','federal').filter(r=>r.pub_year===y),'federal').map(r=>[r.key,r.n]))}));
  stack100(p3,cats,['yes','no','unknown'],{colors:{yes:S[0],no:S[1],unknown:'var(--axis)'}});
  legend(p3,[['yes',S[0]],['no',S[1]],['unknown','var(--axis)']],'federal');
}

function renderQuality(){
  const c=document.getElementById('c-quality'); c.innerHTML='';
  const q=DATA.quality, n=s=>q.filter(r=>r.status===s).length;
  const strip=el('div','kpis');
  [['Passing',n('ok'),'coverage above threshold'],
   ['Warnings',n('warn'),'usable, gap must stay visible'],
   ['Failures',n('fail'),'would mislead if charted'],
   ['Blocked',n('blocked'),'needs data not publicly available']]
   .forEach(([k,v,note])=>strip.appendChild(el('div','kpi',
     `<div class="k">${k}</div><div class="v">${v}</div><div class="n">${note}</div>`)));
  c.appendChild(strip);
  c.appendChild(el('div','note',
    '<b>Blocked is distinct from failing.</b> A failure means something is broken and could be fixed by trying harder. Blocked means the check cannot be evaluated from public data at all — a declared dependency on an input this pipeline does not have. Each blocked row names the input that would resolve it.'));
  const wrap=el('div','pnl'); wrap.appendChild(el('h2',null,'All checks<span>worst first</span>'));
  const inner=el('div','in'); wrap.appendChild(inner); c.appendChild(wrap);
  const ICON={ok:'✓',warn:'!',fail:'✕',blocked:'⊘'};
  const t=el('table','qtbl');
  t.innerHTML='<thead><tr><th style="width:88px">Status</th><th style="width:270px">Check</th><th class="n" style="width:64px">Value</th><th>Detail</th></tr></thead>';
  const tb=el('tbody');
  q.forEach(r=>{
    const tr=el('tr');
    tr.style.cursor='default';
    tr.innerHTML=`<td><span class="pill q-${r.status}">${ICON[r.status]||''} ${esc(r.status)}</span></td>`+
      `<td>${esc(r.check_name)}</td>`+
      `<td class="n">${r.total?(r.pct??0).toFixed(1)+'%':'—'}</td>`+
      `<td style="color:var(--ink-2)">${esc(r.detail)}</td>`;
    tb.appendChild(tr);
  });
  t.appendChild(tb); inner.appendChild(t);
}

const CANVAS={overview:renderOverview,access:renderAccess,funding:renderFunding,
              quality:renderQuality};
let current='overview';

function render(){
  renderChips(); renderRail();
  CANVAS[current]();
  document.querySelectorAll('.canvas').forEach(c=>c.classList.toggle('on',c.dataset.c===current));
  document.getElementById('rail').style.display=(current==='quality')?'none':'';
}

const TABS=[['overview','Overview'],['access','Open access'],['funding','Funding'],
            ['quality','Data quality']];
const tabs=document.getElementById('tabs');
tabs.innerHTML=TABS.map(([k,l],i)=>`<button data-t="${k}" aria-selected="${i===0}">${l}</button>`).join('');
tabs.onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  current=b.dataset.t;
  tabs.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',x===b));
  render();
};

const M=DATA.meta, T=DATA.totals;
const h0=DATA.harvests[0]||{};
document.getElementById('foot').innerHTML=
  `<span><b>Source</b> OpenAlex (CC0) · Crossref · OpenAPC (CC0)</span>`+
  `<span><b>Coverage</b> ${M.years.join('–')} · works with a Stanford affiliation · funder data on 46% of works</span>`+
  `<span><b>Harvest</b> ${fmt(h0.publication_count)} works for $${h0.openalex_cost_usd||'0'} \u00b7 built ${M.generated_at}</span>`+
  `<div class="sp"></div>`+
  `<span>Not a Stanford system \u00b7 modeled on sul-dlss/rialto-airflow</span>`;

document.getElementById('meta').textContent=
  `${fmt(T.publications)} publications · ROR ${M.ror} · ${M.years.join('–')} · OpenAlex + Crossref + OpenAPC`;

render();
</script>
